<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus SDR · Actual Talent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Montserrat', sans-serif;
  background: #0A0A0A;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#bg { position: fixed; inset: 0; z-index: 0; }
.gate {
  position: relative; z-index: 1;
  width: min(420px, calc(100vw - 48px));
  text-align: center;
  animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.logo { height: 30px; filter: brightness(0) invert(1); opacity: 0.92; margin-bottom: 34px; }
.eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
  color: #C0191E; margin-bottom: 14px;
}
.eyebrow::after { content: ''; display: block; width: 24px; height: 2px; background: #C0191E; margin: 10px auto 0; }
h1 { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 32px; line-height: 1.2; margin-bottom: 10px; }
.sub { font-size: 13px; font-weight: 300; color: rgba(255,255,255,0.55); line-height: 1.7; margin-bottom: 32px; }
form { display: flex; flex-direction: column; gap: 14px; }
input[type="password"] {
  font-family: 'Montserrat', sans-serif; font-size: 14px; letter-spacing: 1px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 4px; color: #fff; padding: 14px 16px; outline: none; text-align: center;
  transition: border-color 0.3s;
}
input[type="password"]:focus { border-color: #C0191E; }
input::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 2px; }
button {
  font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase;
  background: #C0191E; color: #fff; border: none; border-radius: 4px;
  padding: 15px 16px; cursor: pointer; transition: transform 0.2s, background 0.2s;
}
button:hover { background: #a01419; transform: translateY(-1px); }
button:disabled { opacity: 0.55; cursor: wait; transform: none; }
.remember {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 11px; color: rgba(255,255,255,0.5); cursor: pointer; user-select: none;
}
.remember input { accent-color: #C0191E; }
.error {
  font-size: 12px; color: #ff6b6b; min-height: 18px; margin-top: 4px;
}
.shake { animation: shake 0.4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.foot { margin-top: 40px; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.25); }
</style>
</head>

  const ITER = 600000;
  const b2u = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const u2b = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
  const blob = b2u(PAYLOAD);
  const salt = blob.slice(0, 16), iv = blob.slice(16, 28), ct = blob.slice(28);

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
    );
  }
  async function tryKey(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plain);
  }
  let entered = false;
  async function enter(html, key, remember) {
    if (entered) return; entered = true;
    const raw = u2b(await crypto.subtle.exportKey('raw', key));
    sessionStorage.setItem('at_academy_k', raw);
    if (remember) localStorage.setItem('at_academy_k', raw);
    // Reemplazo atomico del documento via DOMParser. NO usamos document.write:
    // es fragil y los gestores de contrasena / extensiones que mutan el DOM del
    // gate provocan render doble (gate + campus a la vez). Esto reemplaza el
    // <html> raiz entero y re-ejecuta los <script> (insertarlos via DOM no los corre).
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.documentElement.replaceWith(document.adoptNode(doc.documentElement));
    document.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }

  // auto-login con clave recordada
  (async () => {
    const stored = sessionStorage.getItem('at_academy_k') || localStorage.getItem('at_academy_k');
    if (!stored) return;
    try {
      const key = await crypto.subtle.importKey('raw', b2u(stored), 'AES-GCM', true, ['decrypt']);
      const html = await tryKey(key);
      await enter(html, key, !!localStorage.getItem('at_academy_k'));
    } catch (e) {
      sessionStorage.removeItem('at_academy_k');
      localStorage.removeItem('at_academy_k');
    }
  })();

  // login con password
  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    const pw = document.getElementById('pw').value.trim();
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'Descifrando...'; err.textContent = '';
    try {
      const key = await deriveKey(pw);
      const html = await tryKey(key);
      await enter(html, key, document.getElementById('rm').checked);
    } catch (e) {
      err.textContent = 'Frase incorrecta. Prueba de nuevo.';
      const g = document.querySelector('.gate');
      g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
})();
