<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyer 1280×720 — ¿Copiloto o sustituto? · 26 may 2026</title>
<meta name="description" content="Flyer 1280x720 thumbnail-optimized para webinar Actual Talent del 26 de mayo 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:        #C0191E;
  --beige:      #E8E5DC;
  --cream:      #F0EEEB;
  --black:      #1A1A1A;
  --near-black: #0A0A0A;
  --gray:       #6B6B6B;
  --white:      #ffffff;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: #1A1A1A;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}

#wrapper {
  display: flex; align-items: center; justify-content: center;
}

.flyer {
  width: 1280px; height: 720px;
  flex-shrink: 0;
  position: relative; overflow: hidden;
  background: var(--near-black);
  background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1.2px, transparent 1.2px);
  background-size: 32px 32px;
  color: var(--white);
  transform-origin: center;
}

@media (max-width: 1320px), (max-height: 760px) {
  body { padding: 0; background: #000; }
  .flyer { transform: scale(min(calc((100vw) / 1280), calc((100vh) / 720))); }
}

/* ── ATMOSPHERE ── */
.flyer::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 65% 70% at 0% 100%, rgba(192,25,30,0.22) 0%, transparent 55%),
    radial-gradient(ellipse 40% 45% at 100% 0%, rgba(192,25,30,0.12) 0%, transparent 55%);
  pointer-events: none; z-index: 1;
}

/* ── TOP BAR ── */
.topbar {
  position: absolute; top: 36px; left: 56px; right: 56px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 10;
}
.brand-mark {
  display: flex; align-items: center; gap: 14px;
}
.at-logo {
  width: 44px; height: 44px;
  border-radius: 10px; background: var(--red);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900; letter-spacing: 1.5px; color: var(--white);
}
.brand-text {
  font-size: 14px; font-weight: 800; letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--white);
}
.brand-text .sep { color: rgba(255,255,255,0.25); margin: 0 10px; }
.brand-text .type { color: var(--red); }

/* ── DATE BLOCK (huge & visible at thumb size) ── */
.date-block {
  position: absolute; top: 124px; left: 56px;
  display: flex; align-items: flex-end; gap: 28px;
  z-index: 5;
}
.date-num {
  font-size: 220px; font-weight: 900; line-height: 0.85;
  color: var(--white); letter-spacing: -0.06em;
}
.date-num em {
  font-style: normal; color: var(--red);
}
.date-side {
  display: flex; flex-direction: column; padding-bottom: 24px; gap: 6px;
}
.date-month {
  font-size: 56px; font-weight: 900; line-height: 0.95;
  color: var(--white); letter-spacing: -0.02em; text-transform: uppercase;
}
.date-time {
  font-size: 32px; font-weight: 700; color: var(--red);
  letter-spacing: -0.01em;
}
.date-tz {
  font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(255,255,255,0.45); margin-top: 2px;
}

/* ── TITLE ── */
.title-wrap {
  position: absolute; top: 360px; left: 56px; right: 56px;
  z-index: 5;
}
.title {
  font-size: 72px; font-weight: 900; line-height: 0.96;
  letter-spacing: -0.035em; color: var(--white);
  max-width: 720px;
}
.title .accent { color: var(--red); font-style: normal; }
.title .q { color: var(--red); }

/* ── SPEAKERS (single row, top-right) ── */
.speakers {
  position: absolute; top: 138px; right: 56px;
  display: flex; gap: 36px;
  z-index: 5;
}
.speaker {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  width: 200px;
}
.sp-photo {
  width: 184px; height: 184px; border-radius: 50%;
  overflow: hidden; position: relative;
  border: 3px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 14px 48px rgba(0,0,0,0.45);
}
.sp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

.sp-meta { text-align: center; }
.sp-role-tag {
  display: inline-block;
  font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: var(--red); background: rgba(192,25,30,0.14);
  padding: 4px 12px; border-radius: 100px; margin-bottom: 8px;
}
.sp-name {
  font-size: 18px; font-weight: 800; color: var(--white); line-height: 1.2;
}
.sp-org {
  font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  color: rgba(255,255,255,0.55); margin-top: 4px;
}

</style>
</head>
<body>

<div id="wrapper">
  <div class="flyer">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="brand-mark">
        <div class="at-logo">AT</div>
        <div class="brand-text">Actual Talent <span class="sep">·</span><span class="type">Webinar 02</span></div>
      </div>
    </div>

    <!-- DATE BLOCK -->
    <div class="date-block">
      <div class="date-num"><em>26</em></div>
      <div class="date-side">
        <div class="date-month">Mayo</div>
        <div class="date-time">12:00h</div>
        <div class="date-tz">CEST · Madrid</div>
      </div>
    </div>

    <!-- TITLE -->
    <div class="title-wrap">
      <h1 class="title">
        <span class="q">¿</span>La IA como <span class="accent">copiloto</span><br>
        o <span class="accent">sustituto</span> del humano<span class="q">?</span>
      </h1>
    </div>

    <!-- SPEAKERS (single row, 2 confirmed) -->
    <div class="speakers">
      <div class="speaker">
        <div class="sp-photo"><img src="../../assets/speakers/karim-barmose.jpg" alt="Karim Barmose"></div>
        <div class="sp-meta">
          <div class="sp-role-tag">Modera</div>
          <div class="sp-name">Karim Barmose</div>
          <div class="sp-org">Actual Talent</div>
        </div>
      </div>
      <div class="speaker">
        <div class="sp-photo"><img src="../../assets/speakers/bruno-pincolini.jpg" alt="Bruno Pincolini"></div>
        <div class="sp-meta">
          <div class="sp-role-tag">Ponente</div>
          <div class="sp-name">Bruno Pincolini</div>
          <div class="sp-org">SAP</div>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
