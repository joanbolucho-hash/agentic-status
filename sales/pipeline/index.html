<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — Sales Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#08090a; --surface:#111214; --surface-2:#16181b; --surface-hi:#1d1f23;
  --border:#1d1f23; --border-strong:#26292e;
  --fg:#e8eaed; --fg-muted:#9ca3af; --fg-subtle:#6b7280;
  --accent:#C0191E; --accent-soft:rgba(192,25,30,.16); --accent-fg:#FCA5A5;
  --at-red:#C0191E; --at-green:#2D5F3D; --at-amber:#B8851A;
  --warn:#B8851A; --rule:rgba(255,255,255,.06); --rule-soft:rgba(255,255,255,.03);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Montserrat',system-ui,sans-serif;font-weight:300;color:var(--fg);background:var(--bg);line-height:1.6;font-feature-settings:"tnum" 1,"lnum" 1}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}
.shell{max-width:1080px;margin:0 auto;padding:32px 28px 80px}
.masthead{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:32px;display:flex;align-items:center;gap:16px}
.masthead .brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fg)}
.masthead .brand::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.masthead .brand span{color:var(--accent);font-weight:700}
.masthead .crumb{font-size:11px;color:var(--fg-subtle);letter-spacing:.12em;text-transform:uppercase;font-weight:500;flex:1;text-align:right}
.masthead .crumb a:hover{color:var(--accent)}
.masthead .crumb .sep{margin:0 10px;color:var(--fg-subtle)}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border);padding-top:10px;margin:36px 0 24px}
.eyebrow .label{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--fg)}
.eyebrow .meta{font-size:11px;color:var(--fg-subtle);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:clamp(22px,3vw,32px);font-weight:300;letter-spacing:-.015em;line-height:1.2;margin-top:24px;color:var(--fg)}
h1 em{font-style:normal;color:var(--accent);font-weight:500}
.sub{color:var(--fg-muted);font-size:12px;margin-top:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:24px 0 28px}
.kpi{padding:16px 14px 16px 0;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none;padding-right:0}
.kpi .label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-subtle);font-weight:500;margin-bottom:8px}
.kpi .value{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--fg)}
table.list{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.list thead tr th{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--fg-subtle);border-bottom:1px solid var(--border);padding:10px 8px 10px 0;text-align:left}
table.list td{padding:14px 8px 14px 0;border-bottom:1px solid var(--rule-soft);color:var(--fg-muted)}
table.list tbody tr{transition:background .15s}
table.list tbody tr:hover{background:var(--surface-2)}
table.list .lead{font-weight:500;color:var(--fg)}
table.list .num{text-align:right;font-variant-numeric:tabular-nums}
table.list .inactive-flag{color:var(--warn);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px}
.stage-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s}
.stage-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.stage-tile .name{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-subtle);font-weight:600;margin-bottom:8px}
.stage-tile .count{font-size:32px;font-weight:700;color:var(--fg);letter-spacing:-.02em;line-height:1}
.stage-tile .meta{margin-top:8px;font-size:11px;color:var(--fg-muted)}
.stage-tile .meta strong{color:var(--fg);font-weight:500}
.stage-tile .inactives{margin-top:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:600}
.colophon{margin-top:60px;padding-top:18px;border-top:1px solid var(--border);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-subtle)}
.colophon code{font-family:ui-monospace,monospace;font-size:10px;text-transform:none;letter-spacing:.02em;color:var(--fg-muted)}
.led-empty{text-align:center;padding:60px 20px;color:var(--fg-subtle);font-size:13px}
</style>
</head><body><div class="shell">
<div class="masthead">
  <div class="brand">Sales <span>Cockpit</span></div>
  <div class="crumb"><a href="../">Sales Cockpit</a><span class="sep">/</span><span>Pipeline</span></div>
</div>

<div class="eyebrow"><div class="label">Pipeline overview</div><div class="meta">(unknown)</div></div>
<h1>Pipeline · <em>0</em> opps abiertas</h1>
<div class="sub">— en valor abierto · 0 inactivos &gt;14d</div>
<div class="kpi-row">
  <div class="kpi"><div class="label">Total open</div><div class="value">0</div></div>
  <div class="kpi"><div class="label">Valor open</div><div class="value">—</div></div>
  <div class="kpi"><div class="label">Inactivos</div><div class="value">0</div></div>
  <div class="kpi"><div class="label">Stages</div><div class="value">0</div></div>
</div>
<div class="stage-grid">

</div>
<div class="colophon">Source: GHL opportunities · clic en un stage para ver la lista completa</div></div></body></html>
